name: Section 17 Validation

on:
  push:
    branches:
      - refinement/connected-accounts-section-17-premium-sep2

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Section 17 formatting
        run: pnpm exec prettier --check src/app/dashboard/accounts/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build

# Temporary validation only; remove before opening the Section 17 PR.
