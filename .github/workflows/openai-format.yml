name: Format OpenAI provider

on:
  push:
    branches: [automation/operator-mode]
    paths:
      - "src/lib/ai/openai-provider.ts"
      - "src/lib/multimodal/openai-provider.ts"
      - "tests/unit/openai-provider-layer.test.ts"
      - ".github/workflows/openai-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/operator-mode
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/lib/ai/openai-provider.ts src/lib/multimodal/openai-provider.ts tests/unit/openai-provider-layer.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/openai-provider.ts src/lib/multimodal/openai-provider.ts tests/unit/openai-provider-layer.test.ts
          git commit -m "Format OpenAI provider layer"
          git push
