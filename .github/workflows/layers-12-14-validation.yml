name: Layers 12-14 premium batch validation

on:
  push:
    branches:
      - ux-rebuild/layers-12-14-publish-control-batch

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check batch formatting
        run: pnpm exec prettier --check src/app/dashboard/drive/page.tsx src/app/dashboard/approvals/page.tsx src/app/dashboard/publish/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
