name: Format Operator Mode

on:
  push:
    branches:
      - automation/operator-mode

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/operator-mode
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed implementation files
        run: >
          pnpm exec prettier --write
          src/app/dashboard/operator/actions.ts
          src/app/dashboard/operator/page.tsx
          src/lib/automation/operator.ts
          src/lib/ai/generations.ts
          src/trigger/operator.ts
          src/config/navigation.ts
          supabase/migrations/20260919170000_create_operator_mode.sql
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "precious-promises-content-dashboard"
          git config user.email "precious.promises888@gmail.com"
          git add src/app/dashboard/operator/actions.ts src/app/dashboard/operator/page.tsx src/lib/automation/operator.ts src/lib/ai/generations.ts src/trigger/operator.ts src/config/navigation.ts supabase/migrations/20260919170000_create_operator_mode.sql
          git commit -m "Format Operator Mode implementation"
          git push origin HEAD:automation/operator-mode
