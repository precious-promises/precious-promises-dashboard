name: Mobile Fix Netlify Preview

on:
  push:
    branches:
      - automation/operator-mode
    paths:
      - ".github/workflows/mobile-fix-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/operator-mode

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Netlify authorisation
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Deploy branch preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: a0c7ade4-5f4f-4b94-9998-bae8b9d73976
        run: |
          npx --yes netlify-cli@latest deploy             --build             --alias mobile-fix-preview             --site "$NETLIFY_SITE_ID"             --auth "$NETLIFY_AUTH_TOKEN"             --json | tee netlify-preview.json

      - name: Report preview URL
        run: |
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("netlify-preview.json","utf8")); console.log("PREVIEW_URL="+(d.deploy_url||d.url||"missing"));'
