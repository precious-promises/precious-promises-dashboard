name: Final premium deployment QA

on:
  push:
    branches:
      - qa/final-premium-deployment-sweep

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Local end-to-end smoke
        run: pnpm test:e2e
      - name: Live deployment public mobile and auth smoke
        run: env -u CI APP_URL=https://precious-promises-dashboard-live.netlify.app pnpm exec playwright test tests/e2e/auth.spec.ts tests/e2e/responsive.spec.ts
      - name: Live deployment route and health verification
        shell: bash
        run: |
          set -euo pipefail
          base='https://precious-promises-dashboard-live.netlify.app'
          root='https://preciouspromises.app'

          health="$(curl -fsS "$base/api/health")"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.status!=="ok" || x.service!=="precious-promises-dashboard") process.exit(1)' "$health"

          curl -fsSL -o /dev/null "$base/login"
          curl -fsSL -o /dev/null "$root/"

          paths=(
            /dashboard
            /dashboard/content
            /dashboard/content/new
            /dashboard/media
            /dashboard/scripture
            /dashboard/scripts
            /dashboard/captions
            /dashboard/video
            /dashboard/production
            /dashboard/approvals
            /dashboard/calendar
            /dashboard/publish
            /dashboard/accounts
            /dashboard/drive
            /dashboard/analytics
            /dashboard/growth
            /dashboard/planner
            /dashboard/youtube
            /dashboard/rights
            /dashboard/settings
          )

          for path in "${paths[@]}"; do
            final_url="$(curl -sS -L -o /dev/null -w '%{url_effective}' "$base$path")"
            case "$final_url" in
              "$base/login"|"$base/login/") ;;
              *)
                echo "Protected route did not end at login: $path -> $final_url"
                exit 1
                ;;
            esac
          done
