name: Export source for deployment

on:
  push:
    branches:
      - deployment/export-source

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package repository source
        run: tar --exclude=.git -czf /tmp/precious-promises-dashboard-source.tgz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: precious-promises-dashboard-source
          path: /tmp/precious-promises-dashboard-source.tgz
          if-no-files-found: error
          retention-days: 1
