name: Section 8 Truth Wording Fix

on:
  push:
    branches: [refinement/youtube-playlists-section-8]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refinement/youtube-playlists-section-8
      - name: Restore required Shorts truth wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/dashboard/youtube/page.tsx')
          s = p.read_text()
          old = "Shorts classification remains YouTube&apos;s\n                decision and is never inferred by this workspace."
          new = "Shorts classification is decided by YouTube after processing. The\n                API does not report it, so this dashboard does not claim it."
          if old not in s:
              raise SystemExit('expected truth-boundary wording not found')
          p.write_text(s.replace(old, new))
          PY
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/app/dashboard/youtube/page.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/youtube/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore YouTube Shorts truth wording"
            git push
          fi
