name: Dashboard refinement formatter

on:
  push:
    branches:
      - refinement/dashboard-premium-section-1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refinement/dashboard-premium-section-1
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx
          git commit -m "Format dashboard refinement"
          git push origin HEAD:refinement/dashboard-premium-section-1
