name: Section 12 formatter

on:
  push:
    branches:
      - refinement/video-creation-studio-section-12-premium-v2

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[section12-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refinement/video-creation-studio-section-12-premium-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write 'src/app/dashboard/video/page.tsx' 'src/app/dashboard/video/[id]/page.tsx'
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/dashboard/video/page.tsx' 'src/app/dashboard/video/[id]/page.tsx'
          git commit -m 'Format Section 12 files [section12-format]'
          git push
