name: Section 13 Format

on:
  push:
    branches:
      - refinement/media-assets-section-13-premium

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refinement/media-assets-section-13-premium
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/app/dashboard/media/page.tsx
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/dashboard/media/page.tsx
            git commit -m "Format Section 13 media page"
            git push
          fi
