name: Layer 02 dashboard validation

on:
  push:
    branches:
      - ux-rebuild/layer-02-dashboard-overview

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        run: |
          pnpm exec prettier src/app/dashboard/page.tsx > /tmp/page.formatted.tsx
          diff -u src/app/dashboard/page.tsx /tmp/page.formatted.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
