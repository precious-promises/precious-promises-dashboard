name: Layer 02 dashboard validation

on:
  push:
    branches:
      - ux-rebuild/layer-02-dashboard-overview

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve dashboard truth doctrine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/dashboard/page.tsx')
          text = path.read_text()
          old = 'Operational truth only. Implemented, configured, connected and live-verified remain separate states.'
          new = 'Operational truth only. Implemented is not connected; connected is not authorised; authorised is not live-verified.'
          if old in text:
              path.write_text(text.replace(old, new))
          PY
      - name: Format changed file
        run: |
          pnpm exec prettier --write src/app/dashboard/page.tsx
          if ! git diff --quiet -- src/app/dashboard/page.tsx; then
            git config user.name "precious-promises-content-dashboard"
            git config user.email "precious.promises888@gmail.com"
            git add src/app/dashboard/page.tsx
            git commit -m "Preserve Layer 02 truth boundary"
            git push
          fi
      - name: Check changed-file formatting
        run: pnpm exec prettier --check src/app/dashboard/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
