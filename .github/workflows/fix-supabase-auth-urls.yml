name: Fix Supabase auth production URLs

on:
  push:
    branches:
      - fix/supabase-auth-production-urls

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Supabase management token
        id: token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Supabase management token is available."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository."
          fi

      - name: Repair and verify hosted Auth URL configuration
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const ref = 'yrlnahnbwrtmljcbfjdg';
          const base = `https://api.supabase.com/v1/projects/${ref}/config/auth`;
          const siteUrl = 'https://precious-promises-dashboard-live.netlify.app';
          const requiredRedirect = 'https://precious-promises-dashboard-live.netlify.app/**';
          const token = process.env.SUPABASE_ACCESS_TOKEN;

          const headers = {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          };

          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = text; }
            }
            if (!response.ok) {
              throw new Error(`Supabase Management API ${response.status}: ${typeof body === 'string' ? body : JSON.stringify(body)}`);
            }
            return body;
          }

          const current = await request(base);
          const existing = String(current?.uri_allow_list || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          const allowList = [...new Set([...existing, requiredRedirect])];

          await request(base, {
            method: 'PATCH',
            body: JSON.stringify({
              site_url: siteUrl,
              uri_allow_list: allowList.join(','),
            }),
          });

          const verified = await request(base);
          const verifiedAllowList = String(verified?.uri_allow_list || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);

          if (verified?.site_url !== siteUrl) {
            throw new Error(`Site URL verification failed. Observed: ${verified?.site_url || '(empty)'}`);
          }
          if (!verifiedAllowList.includes(requiredRedirect)) {
            throw new Error('Production redirect URL was not present after update.');
          }

          console.log(`Verified Site URL: ${verified.site_url}`);
          console.log(`Verified production redirect allow-list entry: ${requiredRedirect}`);
          NODE

      - name: Report missing management token
        if: steps.token.outputs.present != 'true'
        run: |
          echo "Hosted Supabase Auth URL configuration was not changed because SUPABASE_ACCESS_TOKEN is unavailable to GitHub Actions."
          exit 78
