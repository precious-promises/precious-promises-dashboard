name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      APP_URL: http://localhost:3000

    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: refinement/dashboard-premium-section-1

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preserve dashboard honesty contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/dashboard/page.tsx')
          s = p.read_text()
          s = s.replace(
              'description="Deployment truth, not decorative green lights."',
              'description="Deployment truth, not decorative green lights. Implemented is not connected; connected is not live-verified."',
          )
          p.write_text(s)
          PY
          pnpm exec prettier --write src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx

      - name: Commit dashboard fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx
          git commit -m "Preserve dashboard honesty contract"
          git push origin HEAD:refinement/dashboard-premium-section-1

      - name: Check changed-file formatting
        run: pnpm exec prettier --check src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build
