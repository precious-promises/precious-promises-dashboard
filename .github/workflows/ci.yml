name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      APP_URL: http://localhost:3000

    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: refinement/dashboard-premium-section-1

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply dashboard precision fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/dashboard/page.tsx')
          s = p.read_text()
          for icon in ['  Gauge,\n', '  Mic2,\n', '  Send,\n']:
              s = s.replace(icon, '')
          needle = 'import { DASHBOARD_PATH, LOGIN_PATH } from "@/lib/auth/routes";\n'
          if 'from "@/lib/content/filters"' not in s:
              s = s.replace(needle, needle + 'import { EMPTY_FILTERS } from "@/lib/content/filters";\n')
          s = s.replace('listContentItems({}),', 'listContentItems(EMPTY_FILTERS),')
          s = s.replace(
              '.filter((entry) =>\n      sameScheduleDay(',
              '.filter((entry) =>\n      entry.post.status === "scheduled" &&\n      sameScheduleDay(',
              1,
          )
          old = '''  const approvalQueue = reviewRows\n    .filter((row) => row.variant.review_state === "ready_for_review")\n    .slice(0, 5);'''
          new = '''  const awaitingApproval = reviewRows.filter(\n    (row) => row.variant.review_state === "ready_for_review",\n  ).length;\n  const approvalQueue = reviewRows\n    .filter((row) => row.variant.review_state === "ready_for_review")\n    .slice(0, 5);'''
          s = s.replace(old, new)
          s = s.replace('value={approvalQueue.length}', 'value={awaitingApproval}')
          s = s.replace('`${approvalQueue.length} waiting for review`', '`${awaitingApproval} waiting for review`')
          p.write_text(s)
          PY
          pnpm exec prettier --write src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx

      - name: Commit dashboard fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx
          git commit -m "Fix and format premium dashboard refinement"
          git push origin HEAD:refinement/dashboard-premium-section-1

      - name: Check changed-file formatting
        run: pnpm exec prettier --check src/app/dashboard/page.tsx src/components/dashboard/owner-badge.tsx

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build
