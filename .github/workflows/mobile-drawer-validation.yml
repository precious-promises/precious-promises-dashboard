name: Mobile drawer validation

on:
  push:
    branches:
      - gapfix/mobile-hamburger-drawer

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        run: pnpm exec prettier --check src/components/dashboard/mobile-sidebar.tsx tests/unit/mobile-sidebar.test.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
