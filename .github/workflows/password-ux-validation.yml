name: Password UX validation

on:
  push:
    branches:
      - fix/password-ux-and-recovery

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed file formatting
        run: pnpm exec prettier --check src/app/login/login-form.tsx src/components/settings/password-form.tsx src/app/auth/update-password/recovery-password-form.tsx tests/unit/password-management-safety.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build
