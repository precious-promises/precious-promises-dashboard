name: Format Bible Study final

on:
  push:
    branches: [automation/operator-mode]
    paths:
      - "src/components/bible-study/study-tools.tsx"
      - "src/app/dashboard/bible-study/page.tsx"
      - ".github/workflows/bible-study-final-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/operator-mode
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/components/bible-study/study-tools.tsx src/app/dashboard/bible-study/page.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bible-study/study-tools.tsx src/app/dashboard/bible-study/page.tsx
          git commit -m "Format final Bible Study UI"
          git push
