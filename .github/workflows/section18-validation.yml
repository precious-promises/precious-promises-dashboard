name: Section 18 Validation

on:
  push:
    branches:
      - refinement/rights-licences-section-18-premium

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Section 18
        run: pnpm exec prettier --write src/app/dashboard/rights/page.tsx
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- src/app/dashboard/rights/page.tsx; then
            git config user.name "precious-promises-content-dashboard"
            git config user.email "precious.promises888@gmail.com"
            git add src/app/dashboard/rights/page.tsx
            git commit -m "Format Section 18 rights page"
            git push
          fi
      - name: Check Section 18 formatting
        run: pnpm exec prettier --check src/app/dashboard/rights/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
