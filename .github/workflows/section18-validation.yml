name: Section 18 Validation

on:
  push:
    branches:
      - refinement/rights-licences-section-18-premium

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Section 18 formatting
        run: pnpm exec prettier --check src/app/dashboard/rights/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build

# Trigger validation after the Section 18 page refinement commit.
