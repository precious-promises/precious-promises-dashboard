name: Section 4 Format

on:
  push:
    branches: [refinement/production-board-section-4]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refinement/production-board-section-4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/app/dashboard/production/page.tsx
      - name: Commit formatting when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/dashboard/production/page.tsx
            git commit -m "style: format Section 4 file"
            git push
          fi
