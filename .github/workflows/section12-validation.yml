name: Section 12 validation

on:
  push:
    branches:
      - refinement/video-creation-studio-section-12-premium-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        run: pnpm exec prettier --check 'src/app/dashboard/video/page.tsx' 'src/app/dashboard/video/[id]/page.tsx'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
