name: Password gap validation

on:
  push:
    branches:
      - gapfix/password-management

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply Prettier to password gap files'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: gapfix/password-management

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format password gap files
        run: >-
          pnpm exec prettier --write
          src/app/dashboard/settings/password-actions.ts
          src/app/dashboard/settings/password/page.tsx
          src/components/settings/password-form.tsx
          src/components/settings/settings-form.tsx
          src/app/login/login-form.tsx
          src/app/login/forgot-password/actions.ts
          src/app/login/forgot-password/reset-request-form.tsx
          src/app/login/forgot-password/page.tsx
          src/app/auth/confirm/route.ts
          src/app/auth/update-password/actions.ts
          src/app/auth/update-password/recovery-password-form.tsx
          src/app/auth/update-password/page.tsx
          tests/unit/password-management-safety.test.ts

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            git commit --allow-empty -m 'Apply Prettier to password gap files'
          else
            git config user.name 'precious-promises-content-dashboard'
            git config user.email 'precious.promises888@gmail.com'
            git add src/app/dashboard/settings/password-actions.ts src/app/dashboard/settings/password/page.tsx src/components/settings/password-form.tsx src/components/settings/settings-form.tsx src/app/login/login-form.tsx src/app/login/forgot-password/actions.ts src/app/login/forgot-password/reset-request-form.tsx src/app/login/forgot-password/page.tsx src/app/auth/confirm/route.ts src/app/auth/update-password/actions.ts src/app/auth/update-password/recovery-password-form.tsx src/app/auth/update-password/page.tsx tests/unit/password-management-safety.test.ts
            git commit -m 'Apply Prettier to password gap files'
          fi
          git push origin HEAD:gapfix/password-management

  validate:
    if: github.event.head_commit.message == 'Apply Prettier to password gap files'
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed-file formatting
        run: >-
          pnpm exec prettier --check
          src/app/dashboard/settings/password-actions.ts
          src/app/dashboard/settings/password/page.tsx
          src/components/settings/password-form.tsx
          src/components/settings/settings-form.tsx
          src/app/login/login-form.tsx
          src/app/login/forgot-password/actions.ts
          src/app/login/forgot-password/reset-request-form.tsx
          src/app/login/forgot-password/page.tsx
          src/app/auth/confirm/route.ts
          src/app/auth/update-password/actions.ts
          src/app/auth/update-password/recovery-password-form.tsx
          src/app/auth/update-password/page.tsx
          tests/unit/password-management-safety.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build
