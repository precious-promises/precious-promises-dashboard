name: Calendar Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - refinement/content-calendar-section-2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enable pnpm via Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check only Section 2 formatting
        run: pnpm exec prettier --check src/app/dashboard/calendar/page.tsx src/components/calendar/month-grid.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
