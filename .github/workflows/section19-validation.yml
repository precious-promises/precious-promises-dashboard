name: Section 19 validation

on:
  push:
    branches:
      - refinement/settings-section-19-premium

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refinement/settings-section-19-premium
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Section 19 formatting
        run: pnpm exec prettier --check src/app/dashboard/settings/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        id: tests
        continue-on-error: true
        run: pnpm test 2>&1 | tee section19-test.log
      - name: Save diagnostic log when tests fail
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f section19-test.log
          git commit -m "Capture Section 19 test failure"
          git push
          exit 1
      - name: Build
        if: steps.tests.outcome == 'success'
        run: pnpm build
