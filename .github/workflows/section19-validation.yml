name: Section 19 validation

on:
  push:
    branches:
      - refinement/settings-section-19-premium

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refinement/settings-section-19-premium
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Section 19
        run: pnpm exec prettier --write src/app/dashboard/settings/page.tsx
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- src/app/dashboard/settings/page.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/dashboard/settings/page.tsx
            git commit -m "Format Section 19 settings page"
            git push
          fi
      - name: Check Section 19 formatting
        run: pnpm exec prettier --check src/app/dashboard/settings/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
