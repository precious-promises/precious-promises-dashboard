name: Format Bible Study module

on:
  workflow_dispatch:
  push:
    branches:
      - automation/operator-mode
    paths:
      - "src/lib/bible-study/**"
      - "src/app/dashboard/bible-study/**"
      - "src/components/bible-study/**"
      - "tests/unit/bible-study-master-spec.test.ts"
      - "src/lib/env/schema.ts"
      - "src/config/navigation.ts"
      - ".github/workflows/bible-study-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/operator-mode
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/lib/bible-study src/app/dashboard/bible-study src/components/bible-study tests/unit/bible-study-master-spec.test.ts src/lib/env/schema.ts src/config/navigation.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bible-study src/app/dashboard/bible-study src/components/bible-study tests/unit/bible-study-master-spec.test.ts src/lib/env/schema.ts src/config/navigation.ts
          git commit -m "Format Bible Study module"
          git push
