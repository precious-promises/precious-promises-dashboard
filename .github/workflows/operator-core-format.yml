name: Format Operator Mode core

on:
  push:
    branches:
      - automation/operator-mode
    paths:
      - "src/lib/automation/operator.ts"
      - ".github/workflows/operator-core-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/operator-mode
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Operator Mode core
        run: pnpm exec prettier --write src/lib/automation/operator.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/automation/operator.ts
          git commit -m "Format Operator Mode core"
          git push
