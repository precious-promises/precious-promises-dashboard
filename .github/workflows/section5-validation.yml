name: Section 5 Validation

on:
  push:
    branches: [refinement/content-planner-section-5]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Section 5 formatting
        run: pnpm exec prettier --check src/app/dashboard/planner/page.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
# Triggered after the formatter commit so validation runs as a normal branch update.
