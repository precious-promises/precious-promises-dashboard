name: Section 3 Validation

on:
  push:
    branches: [refinement/content-library-section-3]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Section 3 formatting
        run: pnpm exec prettier --check src/app/dashboard/content/page.tsx src/components/content/content-card.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
